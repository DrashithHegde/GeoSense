services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    image: geosense-postgis-pgvector:16-3.4
    container_name: geosense-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - geosense_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-geosense}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: geosense-api:local
    container_name: geosense-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ENV: production
      WARM_UP: 0
      MIGRATE_ON_START: 1

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URLS: http://localhost:8000
        MAPBOX_PUBLIC_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    image: geosense-client:local
    container_name: geosense-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:8080"

volumes:
  geosense_postgres_data:
