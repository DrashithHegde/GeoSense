name: Publish NDWI release to GHCR

# This branch is intentionally dedicated to one immutable backend release.
on:
  push:
    branches:
      - release/ndwi-20261124

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved backend release
        uses: actions/checkout@v4
        with:
          ref: 7655bffdc8fc16211ecb6ec47620954f2e3cdb35

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/drashithhegde/geosense-api:api-20261124-ndwi-release1-ghcr
            ghcr.io/drashithhegde/geosense-api:7655bffdc8fc16211ecb6ec47620954f2e3cdb35
          labels: |
            org.opencontainers.image.revision=7655bffdc8fc16211ecb6ec47620954f2e3cdb35
            org.opencontainers.image.source=https://github.com/DrashithHegde/GeoSense

      - name: Record release evidence
        run: |
          echo "image=ghcr.io/drashithhegde/geosense-api:api-20261124-ndwi-release1-ghcr"
          echo "digest=${{ steps.build.outputs.digest }}"
          echo "revision=7655bffdc8fc16211ecb6ec47620954f2e3cdb35"
